name: Market outlook chart
on:
  schedule:
    - cron: "15 5 * * *"      # daily 05:15 UTC – change to taste
  workflow_dispatch:
    inputs:
      symbols: { description: "Comma separated, e.g. BTCUSDT,ETHUSDT", default: "BTCUSDT" }
permissions:
  contents: read
jobs:
  outlook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python main.py --scenario "${{ inputs.symbols || vars.OUTLOOK_SYMBOLS || 'BTCUSDT' }}"
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          PUBLIC_CHANNEL: ${{ secrets.PUBLIC_CHANNEL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          CHANNEL_NAME: ${{ vars.CHANNEL_NAME }}
          TELEGRAM_LINK: ${{ vars.TELEGRAM_LINK }}
          PREMIUM_HANDLE: ${{ vars.PREMIUM_HANDLE }}
          CONTACT_LINK: ${{ vars.CONTACT_LINK }}
          X_LINK: ${{ vars.X_LINK }}
          YOUTUBE_LINK: ${{ vars.YOUTUBE_LINK }}
          BLOFIN_REF_LINK: ${{ vars.BLOFIN_REF_LINK }}
          COPY_TRADING_LINK: ${{ vars.COPY_TRADING_LINK }}
          BINANCE_CREATOR_LINK: ${{ vars.BINANCE_CREATOR_LINK }}
          PREMIUM_LINK: ${{ vars.PREMIUM_LINK }}
          CHANNELS_REPORTS: ${{ vars.CHANNELS_REPORTS }}
          CHANNELS_SIGNALS: ${{ vars.CHANNELS_SIGNALS }}
          CHANNELS_OUTLOOK: ${{ vars.CHANNELS_OUTLOOK }}
          DRY_RUN: ${{ vars.DRY_RUN || '1' }}
