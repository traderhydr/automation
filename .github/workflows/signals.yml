name: Signal charts
on:
  schedule:
    - cron: "*/10 * * * *"    # GitHub may delay scheduled runs by several minutes
  workflow_dispatch:
concurrency: { group: signals, cancel-in-progress: false }
permissions:
  contents: write
jobs:
  signals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python main.py --signals --hours 4
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          PRIVATE_CHANNEL: ${{ secrets.PRIVATE_CHANNEL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          PUBLIC_CHANNEL: ${{ secrets.PUBLIC_CHANNEL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          CHANNEL_NAME: ${{ vars.CHANNEL_NAME }}
          SIGNAL_INTERVAL: ${{ vars.SIGNAL_INTERVAL || '15m' }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Karachi' }}
          PUBLIC_SIGNALS_PER_DAY: ${{ vars.PUBLIC_SIGNALS_PER_DAY || '2' }}
          PUBLIC_SIGNAL_DELAY_MIN: ${{ vars.PUBLIC_SIGNAL_DELAY_MIN || '0' }}
          PREMIUM_LINK: ${{ vars.PREMIUM_LINK }}
          RANDOM_SECRET: ${{ secrets.RANDOM_SECRET }}
          DRY_RUN: ${{ vars.DRY_RUN || '1' }}
      - run: |
          git config user.name "report-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f data/public_signals.json 2>/dev/null; git commit -m "update public signal state" && git pull --rebase -q && git push || true
