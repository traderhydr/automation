name: Trade reports
# Runs hourly but only does work between 00:00 and 02:59 local time (TIMEZONE var, default Asia/Karachi = GMT+5); posted_reports.json stops repeats,
# so a delayed/skipped GitHub run is caught up on the next hour:
#   every day            -> daily report for the day that just ended
#   Monday 00:xx         -> weekly report for the Mon-Sun week that just ended (i.e. "Sunday's" report)
#   1st of the month     -> monthly report for the month that just ended
#   1 January            -> yearly report for the year that just ended
on:
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch:
    inputs:
      period:
        description: Run one report now for the current period (leave 'auto' for the normal gate)
        type: choice
        options: [auto, daily, weekly, monthly, yearly]
        default: auto
permissions:
  contents: write
concurrency: { group: reports, cancel-in-progress: false }
jobs:
  report:
    runs-on: ubuntu-latest
    env:
      TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Karachi' }}
    steps:
      - name: Is it report time?
        id: gate
        run: |
          export TZ="$TIMEZONE"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.period }}" != "auto" ]; then
            echo "jobs=${{ inputs.period }}:$(date +%F)" >> $GITHUB_OUTPUT; exit 0
          fi
          case "$(date +%H)" in 00|01|02) ;; *) false ;; esac || { echo "Not the post-midnight window (00:00-02:59) in $TIMEZONE – nothing to do."; exit 0; }
          y=$(date -d yesterday +%F); jobs="daily:$y"
          [ "$(date -d yesterday +%u)" = "7" ] && jobs="$jobs weekly:$y"        # yesterday was Sunday
          [ "$(date +%d)" = "01" ]             && jobs="$jobs monthly:$y"       # yesterday was month end
          [ "$(date +%m-%d)" = "01-01" ]       && jobs="$jobs yearly:$y"        # yesterday was 31 Dec
          echo "jobs=$jobs" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v4
        if: steps.gate.outputs.jobs != ''
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.jobs != ''
        with: { python-version: "3.12" }
      - if: steps.gate.outputs.jobs != ''
        run: pip install -r requirements.txt
      - name: Build and post reports
        if: steps.gate.outputs.jobs != ''
        run: |
          for j in ${{ steps.gate.outputs.jobs }}; do
            python main.py --period "${j%%:*}" --date "${j##*:}"
          done
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          PRIVATE_CHANNEL: ${{ secrets.PRIVATE_CHANNEL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          PUBLIC_CHANNEL: ${{ secrets.PUBLIC_CHANNEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          CHANNEL_NAME: ${{ vars.CHANNEL_NAME }}
          JOIN_LINK: ${{ vars.JOIN_LINK }}
          MARGIN_PER_TRADE_PCT: ${{ vars.MARGIN_PER_TRADE_PCT || '100' }}
          TELEGRAM_LINK: ${{ vars.TELEGRAM_LINK }}
          CONTACT_LINK: ${{ vars.CONTACT_LINK }}
          X_LINK: ${{ vars.X_LINK }}
          YOUTUBE_LINK: ${{ vars.YOUTUBE_LINK }}
          BLOFIN_REF_LINK: ${{ vars.BLOFIN_REF_LINK }}
          COPY_TRADING_LINK: ${{ vars.COPY_TRADING_LINK }}
          BINANCE_CREATOR_LINK: ${{ vars.BINANCE_CREATOR_LINK }}
          PREMIUM_LINK: ${{ vars.PREMIUM_LINK }}
          DRY_RUN: ${{ vars.DRY_RUN || '1' }}
      - name: Save trade history
        if: steps.gate.outputs.jobs != ''
        run: |
          git config user.name "report-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f data/trades.json data/posted_reports.json data/teasers.json 2>/dev/null; git add -f data/trades.json && git commit -m "update trade history" && git pull --rebase -q && git push || true
