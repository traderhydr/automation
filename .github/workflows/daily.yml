name: Trade reports
on:
  schedule:
    - cron: "30 20 * * 1-5"   # daily   – 20:30 UTC Mon-Fri (set to your market close)
    - cron: "0 9 * * 6"       # weekly  – Saturday 09:00 UTC
    - cron: "0 9 1 * *"       # monthly – 1st of month 09:00 UTC (covers the last 30 days)
    - cron: "0 9 1 1 *"       # yearly  – 1 Jan 09:00 UTC (covers the last 365 days)
  workflow_dispatch:
    inputs:
      period:
        description: Report period
        type: choice
        options: [daily, weekly, monthly, yearly]
        default: daily
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Pick period
        id: p
        run: |
          case "${{ github.event.schedule }}" in
            "0 9 * * 6")  echo "period=weekly"  >> $GITHUB_OUTPUT ;;
            "0 9 1 * *")  echo "period=monthly" >> $GITHUB_OUTPUT ;;
            "0 9 1 1 *")  echo "period=yearly"  >> $GITHUB_OUTPUT ;;
            "")           echo "period=${{ inputs.period }}" >> $GITHUB_OUTPUT ;;
            *)            echo "period=daily"   >> $GITHUB_OUTPUT ;;
          esac
      - run: python main.py --period ${{ steps.p.outputs.period }}
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          PRIVATE_CHANNEL: ${{ secrets.PRIVATE_CHANNEL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          PUBLIC_CHANNEL: ${{ secrets.PUBLIC_CHANNEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          CHANNEL_NAME: ${{ vars.CHANNEL_NAME }}
          JOIN_LINK: ${{ vars.JOIN_LINK }}
          DRY_RUN: ${{ vars.DRY_RUN || '1' }}
      - run: |
          git config user.name "report-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f data/trades.json && git commit -m "update trade history" && git push || true
